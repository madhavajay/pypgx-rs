[package]
name = "pypgx"
version = "0.26.0-rs.1"
edition = "2021"
description = "A 1-for-1 Rust port of PyPGx (pharmacogenomics)"
license = "MIT"

[lib]
name = "pypgx"
path = "src/lib.rs"

[[bin]]
name = "pypgx"
path = "src/bin/pypgx.rs"

[features]
# Plotting (matplotlib replacement) — pulls the pure-Rust ruviz/tiny-skia tree.
# Off by default so the analytical core stays dependency-light and fast to build.
plots = ["dep:ruviz"]
# BAM depth via the pure-Rust samtools-rs (its `native::depth` engine, verified
# against C samtools). Off by default; pulls the htslib-rs/noodles tree.
bam = ["dep:samtools-rs"]
# Statistical phasing by shelling out to the beagle-rs binary (drop-in for the
# Beagle jar). `flate2` decodes the bgzf `output.vcf.gz`. Off by default.
beagle = ["dep:flate2"]

[dependencies]
csv = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ruviz = { version = "0.4.19", optional = true }
samtools-rs = { path = "repos/samtools-rs/crates/samtools-rs", optional = true }
flate2 = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"

[profile.test]
opt-level = 0
